; libcli unit tests, run them on the host with: pio test
;
; This file is only used for testing the library itself, it is not evaluated
; when the library is used as dependency of a project.
;
; The history and the tab completion can be disabled at compile time, hence
; there is one environment per configuration. Run a single one with e.g.
; pio test -e native

[platformio]
src_dir = .

[env]
platform = native
extra_scripts = pre:pre_version.py
; Stream and Serial are provided by the minimal Arduino replacement in
; test/support
build_src_filter = -<*> +<cli.cpp> +<command.cpp> +<completion.cpp> +<history.cpp>
build_flags = -I. -Itest/support -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all
test_build_src = yes

[env:native]

[env:native_nohistory]
build_flags = ${env.build_flags} -D CLI_HISTORYSIZ=0
test_ignore = test_history

[env:native_nocompletion]
build_flags = ${env.build_flags} -D CLI_TAB_COMPLETION=0
test_ignore = test_completion
